name = "telegram-code-assistant"
main = "worker.js"
compatibility_date = "2024-11-05"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "bot-db"
database_id = "62205681-a294-416a-9e92-e813bc191d28"

# KV Namespaces
[[kv_namespaces]]
binding = "STATS"
id = "b33bddbc0e8c4d07813dae687f2a41f9"

[[kv_namespaces]]
binding = "FILES"
id = "d965651f54e944a99fabe8f044d608b7"

# Environment Variables (Secrets should be set via wrangler secret)
[vars]
DEFAULT_AI_MODEL = "anthropic/claude-sonnet-4"
MEMORY_DEFAULT_MESSAGES = "30"
MEMORY_TTL_HOURS = "72"
